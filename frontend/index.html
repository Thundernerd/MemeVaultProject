<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/safe.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVP — Meme Vault Project</title>
    <script>
      (function () {
        try {
          // Keep in sync with THEMES / ACCENTS in frontend/src/theme.ts.
          var theme = localStorage.getItem('mvp-theme');
          var accent = localStorage.getItem('mvp-accent');
          if (['dark', 'light'].indexOf(theme) === -1) theme = 'dark';
          if (['blue', 'purple', 'green', 'orange', 'rose'].indexOf(accent) === -1) accent = 'blue';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-accent', 'blue');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
