[package]
name = "memevaultproject"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Self-hosted media downloader and library (Rust + Vue)"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
bytes = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
http-range-header = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
flate2 = "1"
tar = "0.4"
zip = "2"
xz2 = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2"
base64 = "0.22"
url = "2"
urlencoding = "2"
regex = "1"
askama = "0.12"
rust-embed = { version = "8", features = ["mime-guess"] }
openidconnect = { version = "3.5", default-features = false, features = ["reqwest", "rustls-tls"] }
cookie = "0.18"
jsonwebtoken = "9"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "http", "rustls_backend", "cache"] }
tempfile = "3"
walkdir = "2"
which = "7"
dotenvy = "0.15"
http = "1"
headers = "0.4"
async-trait = "0.1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "memevaultproject"
path = "src/main.rs"
