<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MemeVault style prototypes</title>
  <link rel="icon" href="data:," />
  <!--
    Throwaway exploration: the app never imports anything in prototypes/.
    Plain HTML, no build step. Works from disk (file://) or `npx serve prototypes`.
  -->
  <style>
    :root {
      --bg: #fafafa; --surface: #ffffff; --border: #e4e4e7; --text: #18181b;
      --muted: #71717a; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b; --surface: #18181b; --border: #27272a; --text: #fafafa;
        --muted: #a1a1aa; --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 56rem; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 32px 0 12px; }
    p { margin: 0; }
    .lede { color: var(--muted); }
    a { color: var(--accent); }
    code { font-size: 0.875em; }

    .styles { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .style {
      display: flex; align-items: center; gap: 16px; padding: 14px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    }
    .style .name { font-weight: 600; }
    .style .meta { color: var(--muted); font-size: 0.85rem; }
    .style .body { flex: 1; min-width: 0; }
    .style .status { font-size: 0.75rem; white-space: nowrap; color: var(--muted); }
    .style.planned { border-style: dashed; background: transparent; }
    .style.planned .name { color: var(--muted); }
    .style a.open { text-decoration: none; font-weight: 600; white-space: nowrap; }

    .strip { display: flex; gap: 6px; overflow: hidden; height: 72px; border-radius: 8px; }
    .strip img { height: 100%; width: auto; flex: none; border-radius: 6px; }
    .strip .nothumb {
      height: 100%; aspect-ratio: 16 / 9; flex: none; border-radius: 6px;
      border: 1px dashed var(--border); display: grid; place-items: center;
      color: var(--muted); font-size: 0.7rem; text-transform: uppercase;
    }
    .facts { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    .error { color: #e11d48; }
  </style>
</head>
<body>
  <main>
    <h1>MemeVault style prototypes</h1>
    <p class="lede">
      Standalone visual explorations of every screen, for comparing styles side by side.
      Nothing here ships: see <a href="README.md">README.md</a> for the conventions and
      <a href="SCREENS.md">SCREENS.md</a> for the screens each style must cover.
    </p>

    <h2>Styles</h2>
    <ul class="styles" id="styles"></ul>

    <h2>Shared mock data</h2>
    <div class="strip" id="strip" aria-label="Mock thumbnails"></div>
    <p class="facts" id="facts"></p>
  </main>

  <script src="shared/mock-data.js"></script>
  <script>
    // The style registry. A style ticket adds its folder (prototypes/<dir>/index.html)
    // and flips `ready` to true. Rows with ready: false render as an empty state.
    var STYLES = [
      { dir: 'brutalist', name: 'Brutalist / bold', issue: 11, ready: true },
      { dir: 'glassy', name: 'Glassy / modern', issue: 12, ready: false },
      { dir: 'retro', name: 'Retro / Y2K', issue: 13, ready: false },
      { dir: 'editorial', name: 'Minimal editorial', issue: 14, ready: false },
    ]

    function el(tag, cls, text) {
      var e = document.createElement(tag)
      if (cls) e.className = cls
      if (text != null) e.textContent = text
      return e
    }

    var list = document.getElementById('styles')
    STYLES.forEach(function (s) {
      var li = el('li', 'style' + (s.ready ? '' : ' planned'))
      var body = el('div', 'body')
      body.appendChild(el('div', 'name', s.name))
      body.appendChild(el('div', 'meta', 'prototypes/' + s.dir + '/ · issue #' + s.issue))
      li.appendChild(body)
      if (s.ready) {
        var a = el('a', 'open', 'Open →')
        a.href = s.dir + '/index.html'
        li.appendChild(a)
      } else {
        li.appendChild(el('span', 'status', 'Not built yet'))
      }
      list.appendChild(li)
    })

    // A glance at the shared fixtures, which also proves mock-data.js loaded.
    var M = window.MOCK
    var facts = document.getElementById('facts')
    if (!M) {
      facts.className = 'facts error'
      facts.textContent = 'shared/mock-data.js did not load.'
    } else {
      var strip = document.getElementById('strip')
      M.media.slice(0, 16).forEach(function (m) {
        var src = M.thumbnail(m)
        if (src) {
          var img = el('img')
          img.src = src
          img.alt = m.title || m.type
          img.title = m.title || '(untitled ' + m.type + ')'
          strip.appendChild(img)
        } else {
          strip.appendChild(el('div', 'nothumb', 'no thumb'))
        }
      })
      facts.textContent =
        M.media.length + ' media items, ' + M.albums.length + ' albums, ' +
        M.queue.length + ' queue items, ' + M.tags.length + ' tags, ' +
        M.shares.length + ' share links. Load it with ' +
        '<script src="../shared/mock-data.js"> and read window.MOCK.'
    }
  </script>
</body>
</html>
