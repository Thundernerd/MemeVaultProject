<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MemeVault · Retro / Y2K · Share</title>
  <!--
    Throwaway exploration (issue #13). Mirrors templates/share.html: the public page
    people without a login see. Pick the link with ?token=<MOCK.shares token>.
  -->
  <script src="theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 12 12%22%3E%3Crect width=%2212%22 height=%2212%22 fill=%22%232f6bff%22/%3E%3Crect x=%223%22 y=%223%22 width=%226%22 height=%226%22 fill=%22%23ffd24a%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="retro.css" />
  <style>
    body { display: flex; flex-direction: column; align-items: center; padding: 24px 16px; gap: 16px; }
    .share-header { display: flex; align-items: center; gap: 8px; font-size: 22px; color: var(--accent); }
    .share-header .px svg { filter: drop-shadow(2px 2px 0 var(--accent-2)); }
    .share-header .ico { width: 28px; height: 28px; }
    .share-win { width: 100%; max-width: 900px; }
    .share-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
    .share-meta h1 { flex: 1 1 240px; margin: 0; font-size: 16px; overflow-wrap: anywhere; }
    .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    @media (max-width: 767px) { .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .album-grid .player .screen { min-height: 0; aspect-ratio: 1; }
    .album-grid .player .screen img { width: 100%; height: 100%; object-fit: cover; max-height: none; }
    .share-footer { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; font-size: 11px; color: var(--text-secondary); }
    .share-footer .badge88 {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px;
      background: var(--surface-1); color: var(--text-primary);
      border: 1px solid var(--border-strong); box-shadow: var(--raised);
    }
    .share-footer .badge88 .ico { width: 14px; height: 14px; }
    .proto-note { font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="share-header" id="share-header"></header>
  <main class="share-win" id="share"></main>
  <footer class="share-footer" id="share-footer"></footer>

  <script src="../shared/mock-data.js"></script>
  <script src="pixel-font.js"></script>
  <script src="icons.js"></script>
  <script>
    (function () {
      'use strict'
      var M = window.MOCK
      var px = window.PixelFont.render
      var icon = window.Icons.render

      function h(tag, props, kids) {
        var e = document.createElement(tag)
        Object.keys(props || {}).forEach(function (k) {
          var v = props[k]
          if (v == null || v === false) return
          if (k === 'class') e.className = v
          else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v)
          else e.setAttribute(k, v === true ? '' : v)
        })
        ;[].concat(kids == null ? [] : kids).forEach(function (c) {
          if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c)
        })
        return e
      }

      function duration(s) {
        if (s == null) return '0:00'
        var m = Math.floor(s / 60)
        return m + ':' + ('0' + (s % 60)).slice(-2)
      }

      /** Video: poster with fake transport. Image: the picture itself. */
      function player(m) {
        var src = M.thumbnail(m)
        if (m.type !== 'video') {
          return h('div', { class: 'player image' }, h('div', { class: 'screen' }, h('img', { src: src, alt: m.title || '' })))
        }
        return h('div', { class: 'player video' }, [
          h('div', { class: 'screen' }, src ? h('img', { src: src, alt: '' }) : h('span', { class: 'no-signal' }, 'NO SIGNAL')),
          h('div', { class: 'transport' }, [
            h('button', { class: 'btn small', type: 'button', 'aria-label': 'Play' }, '▶'),
            h('div', { class: 'seek' }, h('div')),
            h('span', { class: 'time' }, '0:00 / ' + duration(m.duration)),
          ]),
        ])
      }

      function windowWith(title, iconName, body) {
        return h('section', { class: 'win', 'aria-label': title }, [
          h('div', { class: 'titlebar' }, [
            h('div', { class: 'title' }, [icon(iconName), px(title)]),
            h('div', { class: 'controls' }, [
              h('span', { class: 'tb-btn', 'aria-hidden': 'true' }, '_'),
              h('span', { class: 'tb-btn', 'aria-hidden': 'true' }, '□'),
              h('span', { class: 'tb-btn', 'aria-hidden': 'true' }, '×'),
            ]),
          ]),
          h('div', { class: 'win-body' }, body),
        ])
      }

      var token = new URLSearchParams(location.search).get('token') || M.shares[0].token
      var link = M.shares.filter(function (s) { return s.token === token })[0]
      var all = M.media.concat.apply(M.media, M.albums.map(function (a) { return a.media }))
      var main = document.getElementById('share')

      document.getElementById('share-header').appendChild(h('div', { class: 'brand' }, [icon('safe'), px('MVP')]))

      if (!link) {
        main.appendChild(windowWith('Error', 'error', h('div', { class: 'msgbox' }, [icon('error'), h('p', null, 'Not found')])))
      } else if (link.album_id) {
        var album = M.albums.filter(function (a) { return a.id === link.album_id })[0]
        document.title = (album.title || 'Shared album') + ' · MemeVault'
        main.appendChild(windowWith(album.title ? 'Album' : 'Shared album', 'folder', [
          h('div', { class: 'album-grid' }, album.media.map(player)),
          h('div', { class: 'share-meta' }, h('h1', null, album.title || 'Shared album')),
        ]))
      } else {
        var m = all.filter(function (x) { return x.id === link.media_id })[0]
        document.title = (m.title || 'Shared media') + ' · MemeVault'
        main.appendChild(windowWith(m.type === 'video' ? 'Media Player' : 'Picture Viewer', m.type === 'video' ? 'film' : 'picture', [
          player(m),
          h('div', { class: 'share-meta' }, [
            h('h1', null, m.title || 'Shared media'),
            link.allow_download ? h('a', { class: 'btn primary', href: M.thumbnail(m) || '#', download: (m.title || 'media') + '.' + m.format }, '⇩ Download') : null,
          ]),
        ]))
      }

      var Theme = window.RetroTheme
      var footer = document.getElementById('share-footer')
      footer.appendChild(h('span', { class: 'badge88' }, [icon('globe'), 'Shared via MemeVault']))
      footer.appendChild(h('span', { class: 'proto-note' }, [
        'Prototype: ',
        h('a', { href: 'index.html' }, 'back to the app'),
        ' · ',
        h('button', {
          class: 'btn small', type: 'button',
          onclick: function () { Theme.setTheme(Theme.theme === 'dark' ? 'light' : 'dark') },
        }, 'Toggle theme'),
      ]))
    })()
  </script>
</body>
</html>
