<!doctype html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MVP · Glassy prototype</title>
  <!--
    Throwaway exploration (issue #12): the app never imports anything in prototypes/.
    One page with a hash router: #/vault, #/queue, #/tags, #/settings/<tab>.
    Query flags after the hash open modals and states, e.g. #/vault?add or
    #/vault?state=empty. prototypes/glassy/index.html lists every one.
  -->
  <link rel="icon" href="data:," />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="glass.css" />
</head>
<body>
  <header class="header glass" id="header">
    <a class="logo" href="#/vault" aria-label="MVP home">
      <span class="logo-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="4" />
          <circle cx="14" cy="12" r="3.2" />
          <path d="M14 8.8v-1M14 16.2v-1M7 9v6" />
        </svg>
      </span>
      <span class="logo-text"><strong>MVP</strong><span id="version"></span></span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="header-end">
      <div id="switcher"></div>
      <a class="signout" href="#/vault" title="Shown when OIDC is enabled">Sign out</a>
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="drawer">☰</button>
    </div>
  </header>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <nav class="drawer-panel glass" id="drawer-nav" aria-label="Main"></nav>
  </div>

  <main class="main" id="main"></main>
  <div id="modal-root"></div>

  <script src="../shared/mock-data.js"></script>
  <script src="app.js"></script>
  <script src="modals.js"></script>
  <script src="queue.js"></script>
  <script src="tags.js"></script>
</body>
</html>
