<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Tags · Minimal editorial</title>
  <!-- Throwaway prototype: mirrors views/TagsView.vue. -->
  <link rel="stylesheet" href="editorial.css" />
  <script src="../shared/mock-data.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header id="site-header" data-active="tags"></header>

  <main class="wrap">
    <div class="page-head">
      <h1 class="page-title">Tags<span class="count" id="count"></span></h1>
      <button class="btn btn-ghost" id="purge" type="button">Purge unused</button>
    </div>
    <div class="tag-groups" id="groups"></div>
  </main>

  <script>
    (function () {
      var M = window.MOCK, ED = window.ED, el = ED.el
      var tags = M.tags.slice()
      var host = document.getElementById('groups')

      // Same grouping as TagsView.vue: the part before ":", otherwise "other".
      function grouped() {
        var map = {}
        tags.forEach(function (t) {
          var i = t.name.indexOf(':')
          var ns = i > 0 ? t.name.slice(0, i) : 'other'
          ;(map[ns] = map[ns] || []).push(t)
        })
        return Object.keys(map).sort(function (a, b) {
          if (a === 'other') return 1
          if (b === 'other') return -1
          return a.localeCompare(b)
        }).map(function (ns) { return [ns, map[ns]] })
      }

      function render() {
        ED.clear(host)
        document.getElementById('count').textContent = String(tags.length)
        grouped().forEach(function (g) {
          var ns = g[0]
          host.appendChild(el('section', { class: 'tag-group' },
            el('h2', null, ns, el('span', { class: 'label' }, g[1].length + (g[1].length === 1 ? ' tag' : ' tags'))),
            g[1].map(function (t) {
              var i = t.name.indexOf(':')
              var unused = t.usage_count === 0
              return el('div', { class: 'tag-row' + (unused ? ' is-unused' : '') },
                el('span', { class: 'name', title: t.name },
                  i > 0 ? el('span', { class: 'ns' }, t.name.slice(0, i + 1)) : null,
                  i > 0 ? t.name.slice(i + 1) : t.name),
                el('span', { class: 'count', title: unused ? 'Unused' : t.usage_count + ' items' }, t.usage_count),
                el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Delete tag ' + t.name, onclick: function () {
                  tags.splice(tags.indexOf(t), 1); render()
                } }, '✕'))
            })))
        })
        if (!tags.length) host.appendChild(el('div', { class: 'state' }, el('h2', { class: 'state-title' }, 'No tags yet.')))
      }

      document.getElementById('purge').addEventListener('click', function () {
        tags = tags.filter(function (t) { return t.usage_count > 0 })
        render()
      })
      render()
    })()
  </script>
</body>
</html>
