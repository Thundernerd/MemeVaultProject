<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Settings · Minimal editorial</title>
  <!-- Throwaway prototype: mirrors views/settings/SettingsLayout.vue and each tab view. -->
  <link rel="stylesheet" href="editorial.css" />
  <script src="../shared/mock-data.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <header id="site-header" data-active="settings"></header>

  <main class="wrap">
    <div class="page-head" style="border-bottom:0;padding-bottom:0">
      <h1 class="page-title">Settings</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="Settings sections"></nav>
    <div id="tab"></div>
  </main>

  <script>
    (function () {
      var M = window.MOCK, ED = window.ED, el = ED.el
      var S = JSON.parse(JSON.stringify(M.settings))
      var env = S._overridden_by_env || []
      var failSave = false

      var TABS = [
        { id: 'general', label: 'General' },
        { id: 'binaries', label: 'Binaries' },
        { id: 'cookies', label: 'Cookies' },
        { id: 'sharing', label: 'Sharing' },
        { id: 'api', label: 'API' },
        { id: 'discord', label: 'Discord' },
        { id: 'fluxer', label: 'Fluxer' },
      ]

      // ------------------------------------------------------------ helpers
      function isOn(v) { return v === 'true' } // the backend stores 'true' / 'false'

      function field(label, key, attrs) {
        attrs = attrs || {}
        var locked = env.indexOf(key) >= 0
        var input = el('input', Object.assign({ class: 'input', value: S[key] || '', disabled: locked || null,
          oninput: function (e) { S[key] = e.target.value } }, attrs))
        return el('label', { class: 'field' },
          el('span', { class: 'label' }, label, locked ? el('span', { class: 'env-tag' }, ' (env)') : null),
          input,
          locked ? el('span', { class: 'muted', style: { 'font-size': '0.75rem' } }, 'Set by an environment variable; change it there.') : null)
      }

      function check(label, key, on) {
        return el('label', { class: 'check' },
          el('input', { type: 'checkbox', checked: on ? true : null, onchange: function (e) { S[key] = e.target.checked ? 'true' : 'false' } }),
          label)
      }

      /** Save button plus the "Saved" / error line every tab has. */
      function saveRow(label) {
        var msg = el('p', { class: 'msg', 'aria-live': 'polite' })
        var btn = el('button', { class: 'btn', type: 'submit' }, label || 'Save')
        return {
          node: el('div', { class: 'form-actions' }, btn, msg),
          submit: function (e) {
            e.preventDefault()
            msg.className = 'msg ' + (failSave ? 'msg-err' : 'msg-ok')
            msg.textContent = failSave ? 'Request failed (500): could not write settings' : 'Saved'
          },
        }
      }

      function form(children, save) {
        return el('form', { class: 'form-stack', onsubmit: save.submit }, children, save.node)
      }

      // --------------------------------------------------------------- tabs
      var VIEWS = {
        general: function () {
          var s = saveRow()
          return form([
            field('Download path', 'download_path'),
            field('yt-dlp extra args', 'ytdlp_extra_args', { class: 'input mono' }),
            field('gallery-dl extra args', 'gallerydl_extra_args', { class: 'input mono' }),
          ], s)
        },

        binaries: function () {
          var list = el('ul', { class: 'list' })
          Object.keys(M.binaries).forEach(function (k) {
            var b = M.binaries[k]
            var btn = el('button', { class: 'btn btn-ghost', type: 'button' }, 'Download / update')
            btn.addEventListener('click', function () {
              btn.disabled = true; btn.textContent = '…'
              setTimeout(function () { btn.disabled = false; btn.textContent = 'Download / update' }, 900)
            })
            list.appendChild(el('li', null,
              el('div', { class: 'item-main' },
                el('p', { class: 'item-title' }, b.name),
                el('p', { class: 'item-sub' }, b.path)),
              el('p', { class: 'item-status ' + (b.exists ? 'ok' : 'missing') }, b.exists ? (b.version || 'installed') : 'missing'),
              btn))
          })
          var s = saveRow('Save paths')
          return el('div', null,
            el('p', { class: 'eyebrow', style: { 'margin-bottom': '12px' } }, 'Status'),
            list,
            el('p', { class: 'eyebrow', style: { 'margin-bottom': '20px' } }, 'Path overrides'),
            form([
              field('yt-dlp path', 'ytdlp_bin', { placeholder: 'auto-managed', class: 'input mono' }),
              field('gallery-dl path', 'gallerydl_bin', { placeholder: 'auto-managed', class: 'input mono' }),
              field('ffmpeg path', 'ffmpeg_bin', { placeholder: 'auto-managed', class: 'input mono' }),
            ], s))
        },

        cookies: function () {
          var list = el('ul', { class: 'list' })
          ;['ytdlp', 'gallerydl'].forEach(function (tool) {
            var c = M.cookies[tool]
            var status = el('p', { class: 'item-sub' })
            var del = el('button', { class: 'link-btn danger', type: 'button' }, 'Delete')
            function paint() {
              ED.clear(status)
              status.textContent = c.exists ? ED.fmtBytes(c.size) + ' · ' + ED.fmtDate(c.modifiedAt) : 'Not uploaded'
              del.hidden = !c.exists
            }
            del.addEventListener('click', function () { c = { exists: false }; paint() })
            var input = el('input', { type: 'file', accept: '.txt', 'aria-label': 'Upload ' + tool + ' cookies', onchange: function (e) {
              var f = e.target.files[0]
              if (f) { c = { exists: true, size: f.size, modifiedAt: new Date().toISOString() }; paint() }
            } })
            paint()
            list.appendChild(el('li', null,
              el('div', { class: 'item-main' }, el('h3', { class: 'item-title' }, tool + ' cookies'), status),
              el('span', { class: 'btn btn-ghost file-pick' }, 'Upload cookies.txt', input),
              del))
          })
          return el('div', null,
            el('p', { class: 'tab-intro' }, 'Netscape-format cookie files let the downloaders reach content that needs a signed-in session.'),
            list)
        },

        sharing: function () {
          var s = saveRow()
          return form([
            field('Default expiry (days, empty = never)', 'share_default_expiry_days', { inputmode: 'numeric' }),
            el('label', { class: 'check' },
              el('input', { type: 'checkbox', checked: S.share_default_allow_download !== '0' ? true : null,
                onchange: function (e) { S.share_default_allow_download = e.target.checked ? '1' : '0' } }),
              'Allow download by default'),
            field('Share base URL (OG embeds)', 'share_base_url', { placeholder: 'https://memes.example.com' }),
            el('label', { class: 'field' }, el('span', { class: 'label' }, 'Random mode'),
              el('select', { class: 'select', onchange: function (e) { S.random_mode = e.target.value } },
                el('option', { value: 'flag', selected: S.random_mode === 'flag' ? true : null }, 'Flagged items'),
                el('option', { value: 'shared', selected: S.random_mode === 'shared' ? true : null }, 'Items with share links'))),
          ], s)
        },

        api: function (opts) {
          var keys = M.apiKeys.slice()
          var created = null
          if (opts && opts.reveal) { created = M.newApiKey; keys.unshift(created) }
          var host = el('div')
          var listHost = el('ul', { class: 'list' })
          var revealHost = el('div')
          function paint() {
            ED.clear(revealHost)
            if (created) {
              revealHost.appendChild(el('div', { class: 'reveal' },
                el('p', { class: 'eyebrow', style: { color: 'var(--accent)' } }, 'New key (copy now)'),
                el('code', null, created.key),
                el('p', { class: 'muted', style: { 'font-size': '0.75rem' } }, 'It is shown once. Store it somewhere safe.')))
            }
            ED.clear(listHost)
            keys.forEach(function (k) {
              listHost.appendChild(el('li', null,
                el('div', { class: 'item-main' },
                  el('p', { class: 'item-title' }, k.name),
                  el('p', { class: 'item-sub', style: { 'font-family': 'var(--font-sans)' } },
                    k.permission, ' · created ', ED.fmtDate(k.created_at), ' · ', k.last_used_at ? 'last used ' + ED.fmtDate(k.last_used_at) : 'never used')),
                el('button', { class: 'link-btn danger', type: 'button', onclick: function () {
                  keys.splice(keys.indexOf(k), 1)
                  if (created === k) created = null
                  paint()
                } }, 'Revoke')))
            })
          }
          var nameInput = el('input', { class: 'input', required: true, placeholder: 'Key name (e.g. Extra tool)' })
          var perm = el('select', { class: 'select', 'aria-label': 'Permission' },
            el('option', { value: 'read' }, 'read'), el('option', { value: 'read_write' }, 'read_write'))
          var createForm = el('form', { class: 'create-key', onsubmit: function (e) {
            e.preventDefault()
            created = Object.assign({}, M.newApiKey, { name: nameInput.value, permission: perm.value })
            keys.unshift(created)
            nameInput.value = ''
            paint()
          } },
            el('label', { class: 'field' }, el('span', { class: 'label' }, 'Name'), nameInput),
            el('label', { class: 'field' }, el('span', { class: 'label' }, 'Permission'), perm),
            el('button', { class: 'btn', type: 'submit' }, 'Create key'))
          paint()
          return el('div', null,
            el('p', { class: 'note', style: { 'margin-bottom': '28px' } },
              'The key name is shown as a badge on queue items submitted via ', el('code', null, 'POST /api/v1/submit'),
              '. Pass ', el('code', null, 'includeInRandom: true'), ' to add the item to random selection when it finishes.'),
            createForm, revealHost, listHost)
        },

        discord: function () {
          var s = saveRow()
          return form([
            check('Enable Discord bot', 'discord_enabled', isOn(S.discord_enabled)),
            field('Bot token', 'discord_bot_token', { type: 'password' }),
            field('Client ID', 'discord_client_id', { class: 'input mono' }),
            field('Command name', 'discord_command_name', { placeholder: 'get' }),
            check('Post downloads as the command sender', 'discord_post_as_user', isOn(S.discord_post_as_user)),
            el('p', { class: 'note' },
              'Downloads are posted to Discord only — they are not saved to the vault. They still appear in the Queue (marked Discord) so you can track progress and cancel. When posting as the sender, the bot needs ',
              el('strong', null, 'Manage Webhooks'),
              '; messages use that person\'s name and avatar but are still webhook messages (not real user messages).'),
          ], s)
        },

        fluxer: function () {
          var s = saveRow()
          var cmd = (S.fluxer_command_prefix || '!') + (S.fluxer_command_name || 'get')
          return form([
            check('Enable Fluxer bot', 'fluxer_enabled', isOn(S.fluxer_enabled)),
            field('Bot token', 'fluxer_bot_token', { type: 'password', placeholder: '<application_id>.<secret>' }),
            field('Instance URL', 'fluxer_instance_url', { placeholder: 'https://fluxer.app' }),
            el('div', { class: 'form-row' },
              field('Command prefix', 'fluxer_command_prefix', { placeholder: '!' }),
              field('Command name', 'fluxer_command_name', { placeholder: 'get' })),
            check('Post downloads as the command sender', 'fluxer_post_as_user', isOn(S.fluxer_post_as_user)),
            check('Delete the sender\'s command message', 'fluxer_delete_command_message', S.fluxer_delete_command_message !== 'false'),
            el('p', { class: 'note' },
              'Fluxer bots do not have slash commands, so users invoke the bot with a message like ',
              el('code', null, cmd + ' <url>'), '. Add ', el('code', null, 'image'), ' for image sites (',
              el('code', null, cmd + ' image <url>'),
              ') and any trailing text as a caption. Downloads are posted to Fluxer only — they are not saved to the vault. They still appear in the Queue (marked Fluxer) so you can track progress and cancel. When posting as the sender, the bot needs ',
              el('strong', null, 'Manage Webhooks'),
              '; messages use that person\'s name and avatar but are still webhook messages (not real user messages). Deleting the sender\'s command message requires the bot to hold ',
              el('strong', null, 'Manage Messages'), '; it is skipped in DMs.'),
          ], s)
        },
      }

      // ------------------------------------------------------------- router
      var tabsHost = document.getElementById('tabs')
      var tabHost = document.getElementById('tab')
      TABS.forEach(function (t) { tabsHost.appendChild(el('a', { href: '#' + t.id, 'data-tab': t.id }, t.label)) })

      function render() {
        var id = location.hash.replace(/^#/, '')
        // "#api-new-key" is the API tab right after "Create key": the one-time reveal.
        var reveal = id === 'api-new-key'
        if (reveal) id = 'api'
        if (!VIEWS[id]) id = 'general'
        tabsHost.querySelectorAll('a').forEach(function (a) {
          a.setAttribute('aria-current', a.getAttribute('data-tab') === id ? 'page' : 'false')
        })
        ED.clear(tabHost)
        tabHost.appendChild(el('div', { class: 'tab-body' }, VIEWS[id]({ reveal: reveal })))
      }
      window.addEventListener('hashchange', render)

      // Reviewer switch: what the next "Save" shows.
      var bar = el('div', { class: 'proto-bar' }, el('strong', null, 'Prototype · Save result'))
      var revealLink = el('a', { href: '#api-new-key' }, 'API: new key reveal')
      var opts = [['Saved', false], ['Error', true]].map(function (o) {
        return el('a', { href: '#', 'aria-current': String(o[1] === failSave), onclick: function (e) {
          e.preventDefault()
          failSave = o[1]
          opts.forEach(function (a, i) { a.setAttribute('aria-current', String(i === (failSave ? 1 : 0))) })
        } }, o[0])
      })
      ED.append(bar, opts)
      ED.append(bar, [el('strong', { style: { 'margin-left': '12px' } }, 'State'), revealLink])
      document.body.appendChild(bar)

      render()
    })()
  </script>
</body>
</html>
